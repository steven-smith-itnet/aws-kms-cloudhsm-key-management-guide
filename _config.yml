# ---------------------------------------------------------------------------
# Site configuration for the AWS KMS / CloudHSM key management guide
# Theme: Just the Docs (https://just-the-docs.com)
# ---------------------------------------------------------------------------

title: AWS KMS & CloudHSM Key Management Guide
description: >-
  A step-by-step, command-level guide to planning, deploying, automating, and governing cryptographic key management on AWS with KMS, CloudHSM, custom key stores, and external key stores — using the Console, AWS CLI, Terraform, CloudFormation, the Python SDK, and CI/CD.

url: "https://itnet-steven-smith.github.io"
baseurl: "/aws-kms-cloudhsm-key-management-guide"

theme: just-the-docs

# Clean, trailing-slash URLs (e.g. /docs/overview/ instead of /docs/overview.html)
permalink: pretty

# Apply the Just the Docs "default" layout (sidebar nav, search, theme styling)
# to every page. The home page overrides this with `layout: home`.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# ---- Navigation & layout --------------------------------------------------
aux_links:
  "View on GitHub":
    - "https://github.com/itnet-steven-smith/aws-kms-cloudhsm-key-management-guide"
aux_links_new_tab: true

nav_sort: case_insensitive

# ---- Search ---------------------------------------------------------------
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# ---- Look & feel ----------------------------------------------------------
color_scheme: dark
heading_anchors: true

# ---- Diagrams -------------------------------------------------------------
# Enables rendering of ```mermaid fenced blocks (loaded from jsDelivr at runtime)
mermaid:
  version: "10.9.1"

# Callout styles used throughout the guide
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: yellow
  account:
    title: Account / Portal step
    color: purple

# ---- Footer ---------------------------------------------------------------
footer_content: >-
  Prepared by itnet-steven-smith. This is an independent technical walkthrough based on
  publicly available vendor documentation; it is not affiliated with or endorsed
  by any cloud provider. Cloud APIs and console layouts change frequently —
  verify every step against current official documentation before use in
  production, and validate all cost figures against current pricing pages.

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/itnet-steven-smith/aws-kms-cloudhsm-key-management-guide"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# ---- Build ----------------------------------------------------------------
plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
